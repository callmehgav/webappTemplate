@if (isAdminPanelOpen) {
  <app-admin-panel (closed)="closeAdminPanel()"></app-admin-panel>
} @else {
  @if (showHeader) {
    <app-header (adminRequested)="openAdminPanel()"></app-header>
  }

  <router-outlet></router-outlet>

  <app-hero></app-hero>
  <app-about-section></app-about-section>
  <app-link-tree></app-link-tree>
  <app-contact-me></app-contact-me>
  <app-footer></app-footer>
}
