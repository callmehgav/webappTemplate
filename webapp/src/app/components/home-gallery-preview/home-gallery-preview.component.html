@if (isEnabled() && images().length > 0) {
  <section class="gallery-preview" aria-labelledby="gallery-preview-heading">
    <header>
      <div>
        <p class="eyebrow">{{ sectionText().galleryEyebrow }}</p>
        <h2 id="gallery-preview-heading">{{ sectionText().galleryHeading }}</h2>
      </div>
      <a routerLink="/gallery">Explore the gallery <span aria-hidden="true">↗</span></a>
    </header>

    <div class="preview-grid">
      @for (image of images(); track image.id; let index = $index) {
        <figure [class]="'preview-image image-' + index">
          <img
            [src]="image.contentUrl"
            [alt]="image.altText || 'Venue gallery image'"
            [style.object-position]="image.focalPointX + '% ' + image.focalPointY + '%'"
            loading="lazy" />
        </figure>
      }
    </div>
  </section>
}
