<form class="login-slide-panel open" (ngSubmit)="login()">
  <input type="text" placeholder="Username" name="username" autocomplete="username" [(ngModel)]="username" />
  <input type="password" placeholder="Password" name="password" autocomplete="current-password" [(ngModel)]="password" />
  <button class="login-button" type="submit" [disabled]="isSubmitting">Login</button>
</form>
