<section class="hero" [class.scrolled]="scrolled">
  @if (heroMedia(); as media) {
    @if (isVideo(media)) {
      <video
        class="bg-video"
        [src]="media.contentUrl"
        autoplay
        muted
        loop
        playsinline
        preload="metadata">
      </video>
    } @else {
      <img
        class="bg-video"
        [src]="media.contentUrl"
        [alt]="media.altText || 'Hero background'" />
    }
  } @else {
    <div class="hero-background-placeholder"></div>
  }

  <div class="logo-wrapper">
    <img [src]="logoUrl()" alt="Site logo" />
  </div>

  <div class="hero-actions" [class.visible]="showCTAs()">
    <a routerLink="/book" class="primary-action">
      <span class="action-icon" aria-hidden="true">◷</span>
      View calendar · {{ bookingLabel() }}
    </a>
    <a routerLink="/gallery" class="secondary-action">
      <span class="action-icon" aria-hidden="true">▧</span>
      Gallery
    </a>
    <button type="button" class="tertiary-action" (click)="scrollToAbout()">
      <span class="action-icon" aria-hidden="true">✦</span>
      Learn more
      <span class="down-arrow" aria-hidden="true">↓</span>
    </button>
  </div>
</section>
