<div class="backdrop" role="presentation" (click)="cancelled.emit()">
  <section class="dialog" role="alertdialog" aria-modal="true" [attr.aria-label]="title()" (click)="$event.stopPropagation()">
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
    <div class="actions">
      <button type="button" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
      <button type="button" class="danger" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
    </div>
  </section>
</div>
